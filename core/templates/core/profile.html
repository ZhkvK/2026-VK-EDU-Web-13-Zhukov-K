{% extends 'layout/base.html' %} 
{% load django_bootstrap5 %}

{% block content %}
<main class="container mt-5" style="max-width: 600px;">
  <h2 class="mb-4 text-center">Настройки профиля</h2>
  
  {% if messages %}
    {% for message in messages %}
      <div class="alert alert-success">{{ message }}</div>
    {% endfor %}
  {% endif %}

  <form method="POST" enctype="multipart/form-data" novalidate>
    {% csrf_token %}
    
    {% if user.profile.avatar %}
      <div class="text-center mb-3">
        <img src="{{ user.profile.avatar.url }}" alt="Аватар" class="rounded-circle" width="100" height="100" style="object-fit: cover;">
      </div>
    {% endif %}

    {% bootstrap_form form %}
    
    <button type="submit" class="btn btn-primary w-100 mt-3 mb-5">Сохранить изменения</button>
  </form>
</main>
{% endblock content %}
