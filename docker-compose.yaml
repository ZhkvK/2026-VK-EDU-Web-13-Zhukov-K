version: '3.8'

services:
  db:
    image: postgres:15-alpine
    env_file:
      - .env.docker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "admin"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app                    
      - media_volume:/app/media/
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    depends_on:
        db:
          condition: service_healthy
    stdin_open: true
    tty: true

volumes:
  media_volume:
  postgres_data: