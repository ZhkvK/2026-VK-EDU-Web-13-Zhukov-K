version: '3.8'

services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app                    
      - media_volume:/app/media/
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=application.settings
      - PYTHONUNBUFFERED=1
    stdin_open: true
    tty: true

volumes:
  media_volume: