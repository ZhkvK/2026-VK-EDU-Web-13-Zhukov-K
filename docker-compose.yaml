version: '3.9'

services:
  db:
    image: postgres:15-alpine
    env_file:
      - .env.docker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "admin", "-d", "questions"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  centrifugo:
    image: centrifugo/centrifugo:v6
    ports:
      - "8001:8001"
    env_file:
    - .env.docker
    volumes:
      - ./config.json:/centrifugo/config.json
    command: centrifugo -c /centrifugo/config.json

  maildev:
    image: maildev/maildev:latest
    ports:
      - "1025:1025"
      - "1080:1080"

  web:
    build: .
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             gunicorn -c ./conf/gunicorn.py application.wsgi:application"
    volumes:
      - .:/app                    
      - media_volume:/app/media/
      - static_volume:/app/static/
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s = socket.socket(); s.connect(('127.0.0.1', 8000))"]
      interval: 3s
      timeout: 3s
      retries: 10

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./conf/nginx_docker.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/static:ro
      - media_volume:/app/media:ro
    depends_on:
      web:
        condition: service_healthy

  celery:
    build: .
    command: celery -A application worker -l INFO
    volumes:
      - .:/app
      - media_volume:/app/media/
    env_file:
      - .env.docker
    depends_on:
      - redis
      - db

  celery-beat:
    build: .
    command: celery -A application beat -l INFO
    volumes:
      - .:/app
    env_file:
      - .env.docker
    depends_on:
      - redis
      - db

volumes:
  static_volume:
  media_volume:
  postgres_data:
  redis_data: