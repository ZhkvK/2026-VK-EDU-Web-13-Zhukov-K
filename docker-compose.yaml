version: '3.9'

services:
  db:
    image: postgres:15-alpine
    env_file:
      - .env.docker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "admin", "-d", "questions"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.8
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  centrifugo:
    image: centrifugo/centrifugo:v6
    volumes:
      - ./config.json:/centrifugo/config.json
    command: centrifugo -c /centrifugo/config.json
    ports:
      - "8001:8001"
    env_file:
    - .env.docker

  mailpit:
    image: maildev/maildev:latest
    ports:
      - "1025:1025"
      - "1080:1080"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./conf/nginx_docker.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/static:ro
      - media_volume:/app/media:ro
    depends_on:
      - web

  web:
    build: .
    command: python manage.py runserver
    volumes:
      - .:/app                    
      - media_volume:/app/media/
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    stdin_open: true
    tty: true

  celery:
    build: .
    command: celery -A application worker -l INFO
    volumes:
      - .:/app
      - media_volume:/app/media/
    env_file:
      - .env.docker
    depends_on:
      - redis
      - db

  celery-beat:
    build: .
    command: celery -A application beat -l INFO
    volumes:
      - .:/app
    env_file:
      - .env.docker
    depends_on:
      - redis
      - db

volumes:
  static_volume:
  media_volume:
  postgres_data:
  redis_data: