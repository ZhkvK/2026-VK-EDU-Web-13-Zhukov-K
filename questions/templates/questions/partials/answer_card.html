<div class="card mb-3">
    <div class="row g-0">
      <div class="col-md-2">
        <div
          class="d-flex flex-row flex-md-column align-items-center justify-content-md-center h-100 p-3 gap-3 gap-md-2 bg-light"
        >
          <a href="#" class="text-decoration-none">
            <img
              src="{% static 'questions/img/profile_image_dummy.png' %}"
              class="rounded-circle"
              alt="User2"
              style="width: 60px; height: 60px; object-fit: cover"
            />
          </a>
          <a href="#" class="text-decoration-none text-center">{{answer.author.username}}</a>
        </div>
      </div>
      <div class="col-md-10">
        <div class="card-body">
          <p class="card-text">
            {{answer.text}}
          </p>
          <div class="d-flex justify-content-between align-items-baseline">
            <p class="card-text mb-0">
              <small class="text-body-secondary">{{answer.updated_at}}</small>
            </p>

            <div class="d-flex align-items-center gap-2 vote-group">
              <button
                type="button"
                class="btn btn-outline-success btn-sm btn-like d-flex align-items-center gap-1"
              >
                <i class="bi bi-hand-thumbs-up"></i>
                <span class="vote-count">{{answer.votes.0}}</span>
              </button>
              <button
                type="button"
                class="btn btn-outline-danger btn-sm btn-dislike d-flex align-items-center gap-1"
              >
                <i class="bi bi-hand-thumbs-down"></i>
                <span class="vote-count">{{answer.votes.1}}</span>
              </button>
            </div>
          </div>
          <div class="d-flex justify-content-between align-items-baseline mt-3">
            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                value=""
                id="checkDefault1"
              />
              <label class="form-check-label" for="checkDefault1">
                Отметить правильным
              </label>
            </div>
            <button
              class="btn btn-link btn-sm text-muted p-0 text-decoration-none d-flex align-items-center gap-1"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#commentsAnswer1"
            >
              <i class="bi bi-chat-dots"></i>
              <span>Комментарии (3)</span>
            </button>
          </div>
        </div>

        <div class="collapse" id="commentsAnswer1">
          <div class="border-top pt-3 mt-2">
            <!-- Комментарий 1 (Уровень 1) -->
            <div class="d-flex align-items-start gap-2 mb-3">
              <img
                src="{% static 'questions/img/profile_image_dummy.png' %}"
                class="rounded-circle flex-shrink-0 ms-2"
                width="32"
                height="32"
                style="object-fit: cover"
              />
              <div class="flex-grow-1">
                <div
                  class="d-flex justify-content-between align-items-baseline"
                >
                  <a
                    href="#"
                    class="text-decoration-none fw-bold text-dark small"
                    >User2</a
                  >
                  <small class="text-muted me-3" style="font-size: 0.75rem"
                    >1 час назад</small
                  >
                </div>
                <p class="mb-1 small">Спасибо за ответ! Это помогло.</p>

                <div class="d-flex align-items-center gap-3">
                  <div class="d-flex align-items-center gap-2 vote-group">
                    <button
                      type="button"
                      class="btn btn-outline-success btn-sm btn-like d-flex align-items-center gap-1 py-0 px-2"
                      style="font-size: 0.8rem"
                    >
                      <i class="bi bi-hand-thumbs-up"></i>
                      <span class="vote-count">5</span>
                    </button>
                    <button
                      type="button"
                      class="btn btn-outline-danger btn-sm btn-dislike d-flex align-items-center gap-1 py-0 px-2"
                      style="font-size: 0.8rem"
                    >
                      <i class="bi bi-hand-thumbs-down"></i>
                      <span class="vote-count">0</span>
                    </button>
                  </div>
                  <a href="#" class="text-decoration-none text-muted small"
                    >Ответить</a
                  >
                </div>
              </div>
            </div>

            <!-- Комментарий 2 (Уровень 2 - вложенный) -->
            <div
              class="d-flex align-items-start gap-2 mb-3 ms-4 ps-3 border-start"
            >
              <img
                src="{% static 'questions/img/profile_image_dummy.png' %}"
                class="rounded-circle flex-shrink-0 ms-2"
                width="32"
                height="32"
                style="object-fit: cover"
              />
              <div class="flex-grow-1">
                <div
                  class="d-flex justify-content-between align-items-baseline"
                >
                  <a
                    href="#"
                    class="text-decoration-none fw-bold text-dark small"
                    >User1</a
                  >
                  <small class="text-muted me-3" style="font-size: 0.75rem"
                    >30 мин назад</small
                  >
                </div>
                <p class="mb-1 small">Рад, что помогло! Обращайтесь.</p>

                <div class="d-flex align-items-center gap-3">
                  <div class="d-flex align-items-center gap-2 vote-group">
                    <button
                      type="button"
                      class="btn btn-outline-success btn-sm btn-like d-flex align-items-center gap-1 py-0 px-2"
                      style="font-size: 0.8rem"
                    >
                      <i class="bi bi-hand-thumbs-up"></i>
                      <span class="vote-count">1</span>
                    </button>
                    <button
                      type="button"
                      class="btn btn-outline-danger btn-sm btn-dislike d-flex align-items-center gap-1 py-0 px-2"
                      style="font-size: 0.8rem"
                    >
                      <i class="bi bi-hand-thumbs-down"></i>
                      <span class="vote-count">0</span>
                    </button>
                  </div>
                  <a href="#" class="text-decoration-none text-muted small"
                    >Ответить</a
                  >
                </div>
              </div>
            </div>

            <!-- Комментарий 3 (Уровень 1) -->
            <div class="d-flex align-items-start gap-1 mb-3">
              <img
                src="{% static 'questions/img/profile_image_dummy.png' %}"
                class="rounded-circle flex-shrink-0 ms-2"
                width="32"
                height="32"
                style="object-fit: cover"
              />
              <div class="flex-grow-1">
                <div
                  class="d-flex justify-content-between align-items-baseline"
                >
                  <a
                    href="#"
                    class="text-decoration-none fw-bold text-dark small"
                    >User3</a
                  >
                  <small class="text-muted me-3" style="font-size: 0.75rem"
                    >10 мин назад</small
                  >
                </div>
                <p class="mb-1 small">А можно пример кода?</p>

                <div class="d-flex align-items-center gap-3">
                  <div class="d-flex align-items-center gap-2 vote-group">
                    <button
                      type="button"
                      class="btn btn-outline-success btn-sm btn-like d-flex align-items-center gap-1 py-0 px-2"
                      style="font-size: 0.8rem"
                    >
                      <i class="bi bi-hand-thumbs-up"></i>
                      <span class="vote-count">0</span>
                    </button>
                    <button
                      type="button"
                      class="btn btn-outline-danger btn-sm btn-dislike d-flex align-items-center gap-1 py-0 px-2"
                      style="font-size: 0.8rem"
                    >
                      <i class="bi bi-hand-thumbs-down"></i>
                      <span class="vote-count">0</span>
                    </button>
                  </div>
                  <a href="#" class="text-decoration-none text-muted small"
                    >Ответить</a
                  >
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
