{% load static %}

<div class="d-flex align-items-start gap-2 mb-3">
  <img
    src="{{ user.profile.avatar_url }}"
    class="rounded-circle flex-shrink-0 ms-2"
    width="32"
    height="32"
    style="object-fit: cover"
  />
  <div class="flex-grow-1">
    <div class="d-flex justify-content-between align-items-baseline">
      <a href="#" class="text-decoration-none fw-bold text-dark small"
        >{{ comment.author.username }}</a
      >
      <small class="text-muted me-3" style="font-size: 0.75rem"
        >{{ comment.created_at }}</small
      >
    </div>
    <p class="mb-1 small">{{ comment.content }}</p>

  </div>
</div>
